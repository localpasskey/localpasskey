# Configuration for localpasskeyd(8). Restart the service after changes:
#   sudo systemctl restart localpasskey

[daemon]
# Seconds to wait for you to answer the confirmation dialog.
#prompt_timeout = 120

# Show desktop notifications about problems: a site asks for a passkey that
# is not stored on this computer, a request is declined, times out or fails,
# or no confirmation dialog can be shown. "no" turns off all notifications.
#notifications = yes

# Also show a short notification whenever a passkey is saved, used to sign
# in, deleted, exported or imported, so that you notice any use you didn't expect.
#activity_notifications = yes

# debug, info, warning or error. Only "debug" logs site names.
#log_level = info

[device]
# How the virtual security key identifies itself. Browsers don't care about
# these; change them only if a sandbox (e.g. a snap's u2f-devices interface)
# allows specific USB IDs only.
#name = LocalPasskey Virtual FIDO2 Authenticator
#vendor_id = 0x1209
#product_id = 0x4C50
